[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ebeyparser"
version = "0.1.0"
description = "Kleinanzeigen deal hunter: monitors listings, estimates resale profit, checks photos with a local vision LLM and notifies you."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pillow>=10.0",  # downscale photos before the local AI sees them (much faster)
]

[project.optional-dependencies]
claude = ["anthropic>=1.0"]  # optional: Claude as a second opinion
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
ebeyparser = "ebeyparser.cli:main"

[tool.setuptools.packages.find]
include = ["ebeyparser*"]

[tool.setuptools.package-data]
"ebeyparser.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
