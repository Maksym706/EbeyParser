# 24/7 запуск:  docker compose up -d
# Затем скачай модель:  docker compose exec ollama ollama pull qwen2.5vl:7b
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    # Раскомментируй, если есть видеокарта NVIDIA (нужен nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  ebeyparser:
    build: .
    restart: unless-stopped
    depends_on:
      - ollama
    env_file: .env
    environment:
      OLLAMA_URL: http://ollama:11434
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./data:/app/data
    ports:
      - "8000:8000"

volumes:
  ollama:
