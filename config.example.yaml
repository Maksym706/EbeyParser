# ─────────────────────────────────────────────────────────────────────────────
#  EbeyParser — настройки.
#  Проще всего настроить мастером:  python -m ebeyparser setup
#  (или в панели: http://localhost:8000/setup). Мастер меняет только нужные строки,
#  комментарии в этом файле остаются.
#  Секреты (пароли, токены, ключи) держи в .env и ссылайся на них как ${ИМЯ}.
# ─────────────────────────────────────────────────────────────────────────────

general:
  interval_minutes: 30          # как часто проверять. Категория — до 3 стр. выдачи за проверку; мастер подбирает
                                # интервал, при котором выдача берёт ≤ 40% лимита запросов (7 категорий → 30 мин)
  max_pages: 1                  # сколько страниц выдачи смотреть за раз (новые объявления всё равно сверху)
  fetch_details: true           # открывать перспективные объявления: полный текст + все фото
  request_delay_seconds: [3, 7] # пауза между запросами к сайту (случайная, в секундах)
  max_new_per_search: 25        # максимум новых объявлений на поиск за одну проверку
  data_dir: data                # где лежат база SQLite, логи (data/logs) и кэш категорий

  # ── Воронка: категория — это сотни объявлений, дорогие шаги только для перспективных ──
  # Всё, что не влезло в лимиты, не теряется: оценится в следующей проверке.
  max_comps_lookups_per_run: 40 # сколько раз за проверку искать цены аналогов (это запросы к сайту)
  max_details_per_run: 40       # сколько страниц объявлений открывать за проверку (текст + фото)
  max_ai_per_run: 30            # сколько объявлений за проверку показывать нейросети (0 — без ИИ)
  min_listing_price: 10         # платные объявления дешевле этого — мусор, пропускаем (бесплатные «zu verschenken» смотрим)

  # ── Защита от блокировки на Kleinanzeigen ──
  max_requests_per_hour: 150    # жёсткий лимит страниц в час на один сайт
  block_cooldown_hours: [1, 2, 4, 12]  # после блокировки (403/429/капча) пауза растёт: 1 ч, 2 ч, 4 ч, 12 ч; переживает перезапуск
  baseline_first_run: true      # первая проверка НОВОГО поиска только изучает цены, без уведомлений о «старых» объявлениях
  timezone: Europe/Berlin       # твой часовой пояс: время в уведомлениях, в веб-интерфейсе и в логе

# ─── Что мониторить ──────────────────────────────────────────────────────────
# Главный режим — сканировать КАТЕГОРИИ в радиусе от города: category_id + location + radius_km.
#   Программа смотрит все новые объявления категории и сама находит те, что дешевле рынка.
#   Номера категорий: python -m ebeyparser categories  (с сайта: --live)
#   173 Handy & Telefon · 278 Notebooks · 279 Konsolen · 225 PC-Zubehör & Software · 245 Foto
#   172 Audio & Hifi · 285 Tablets & Reader · 228 PCs · 175 TV & Video · 227 Videospiele
# Точечный поиск: query (ключевые слова) вместо категории или вместе с ней.
# По ссылке: настрой поиск на kleinanzeigen.de и вставь адрес страницы в url.
# purpose: resale — перепродажа (считаем чистую прибыль) | personal — для себя (считаем экономию,
#   target_price — сколько готов заплатить).
# min_price / max_price у категорий — фильтр уведомлений: цены вне диапазона не присылаются, но учитываются
#   для оценки рынка (min_price отсекает чехлы, кабели и мелочь). exclude_keywords — объявления с этими словами в ЗАГОЛОВКЕ
#   пропускаются (defekt, bastler — сломано; suche — «куплю»; tausch — обмен; ersatzteil — на запчасти).
# min_profit у поиска переопределяет pricing.min_profit.
# source: ebay — через официальный API (нужны ключи в разделе ebay ниже).
searches:
  - name: "Handy & Telefon · Berlin 30 км"
    source: kleinanzeigen
    enabled: true
    purpose: resale
    location: Berlin
    radius_km: 30
    category_id: 173
    category_name: Handy & Telefon
    min_price: 50
    max_price: 400
    exclude_keywords: [defekt, bastler, suche, tausch, ersatzteil]

  - name: "Notebooks · Berlin 30 км"
    source: kleinanzeigen
    enabled: true
    purpose: resale
    location: Berlin
    radius_km: 30
    category_id: 278
    category_name: Notebooks
    min_price: 60
    max_price: 500
    exclude_keywords: [defekt, bastler, suche, tausch, ersatzteil]

  - name: "Konsolen · Berlin 30 км"
    source: kleinanzeigen
    enabled: true
    purpose: resale
    location: Berlin
    radius_km: 30
    category_id: 279
    category_name: Konsolen
    min_price: 40
    max_price: 350
    exclude_keywords: [defekt, bastler, suche, tausch, ersatzteil]

  - name: "PC-Zubehör & Software · Berlin 30 км"
    source: kleinanzeigen
    enabled: true
    purpose: resale
    location: Berlin
    radius_km: 30
    category_id: 225
    category_name: PC-Zubehör & Software
    min_price: 30
    max_price: 400
    exclude_keywords: [defekt, bastler, suche, tausch, ersatzteil]

  - name: "Foto · Berlin 30 км"
    source: kleinanzeigen
    enabled: true
    purpose: resale
    location: Berlin
    radius_km: 30
    category_id: 245
    category_name: Foto
    min_price: 40
    max_price: 500
    exclude_keywords: [defekt, bastler, suche, tausch, ersatzteil]

  - name: "Audio & Hifi · Berlin 30 км"
    source: kleinanzeigen
    enabled: true
    purpose: resale
    location: Berlin
    radius_km: 30
    category_id: 172
    category_name: Audio & Hifi
    min_price: 30
    max_price: 300
    exclude_keywords: [defekt, bastler, suche, tausch, ersatzteil]

  - name: "Tablets & Reader · Berlin 30 км"
    source: kleinanzeigen
    enabled: true
    purpose: resale
    location: Berlin
    radius_km: 30
    category_id: 285
    category_name: Tablets & Reader
    min_price: 40
    max_price: 350
    exclude_keywords: [defekt, bastler, suche, tausch, ersatzteil]

  - name: "Для себя: RTX 3090 для AI-сервера"
    source: kleinanzeigen
    enabled: true
    purpose: personal
    query: rtx 3090
    location: Berlin
    radius_km: 30
    max_price: 660
    target_price: 550
    exclude_keywords: [defekt, bastler, suche, tausch]

  - name: "eBay: аукционы видеокарт, заканчиваются скоро"
    source: ebay
    enabled: false
    purpose: resale
    query: rtx 3080
    max_price: 400
    ebay_category_ids: ['27386']
    buying_options: [AUCTION]
    ending_within_hours: 3

# ─── Как считать выгоду ──────────────────────────────────────────────────────
pricing:
  min_profit: 40                # € чистой прибыли, чтобы сказать «покупать»
  min_roi: 0.25                 # и минимум 25% на вложенные деньги
  max_capital:                  # € — дороже этого «покупать» не советовать (пусто = без лимита)
  selling_fee_percent: 0        # частные продавцы на eBay.de и Kleinanzeigen комиссию не платят
  payment_fee_percent: 0        # например 2.49, если продаёшь через PayPal «Waren und Dienstleistungen»
  paypal_fixed_fee: 0           # и фиксированная часть PayPal, например 0.35
  default_shipping_cost: 0      # сколько потратишь на отправку при перепродаже
  safety_margin_percent: 10     # запас: торг, риск, твоё время
  asking_price_discount: 0.85   # цены в объявлениях выше реальных продаж — берём 85%
  vb_expected_discount: 0.10    # «VB» в цене — обычно уступают ~10%
  use_kleinanzeigen_comps: true # искать похожие объявления на Kleinanzeigen
  use_ebay_sold_comps: true     # смотреть проданные на eBay.de (часто закрыто защитой 403 — тогда без них)
  comps_limit: 30
  min_comparables: 6            # меньше аналогов — рынок неясен, максимум «подумать»
  max_price_spread: 0.4         # слишком большой разброс цен аналогов — тоже максимум «подумать»
  # История цен: каждое увиденное объявление запоминается, и цена оценивается по ней без лишних
  # запросов к сайту — поэтому сканирование категорий со временем становится точнее и дешевле.
  use_price_history: true
  history_days: 60              # сколько дней истории учитывать
  history_min_points: 6         # сколько похожих объявлений нужно, чтобы доверять истории
  reference_prices: []          # справочник цен — ТОЛЬКО если точно знаешь рынок; обычно оставь пустым:
  #  - keywords: ["rtx", "3080"]  # все слова должны быть в названии
  #    exclude: ["ti", "laptop"]  # и ни одного из этих
  #    price: 400                 # за сколько такое реально продаётся
  # Без справочника цена считается по истории, похожим объявлениям и продажам — это надёжнее.
  # Если справочная цена сильно расходится с историей, программа предупредит.

# ─── Локальная ИИ-модель (смотрит фото и описание) ───────────────────────────
# Вся оценка идёт на твоём компьютере. LM Studio (https://lmstudio.ai): вкладка Discover →
# скачай Qwen2.5-VL-7B-Instruct → Developer → Start Server. Проверка: python -m ebeyparser ai-check
ai:
  enabled: true
  provider: ${AI_PROVIDER:-openai}                  # openai = LM Studio (и любой OpenAI-совместимый сервер) | ollama
  base_url: ${AI_BASE_URL:-http://localhost:1234/v1}
  model: ${AI_MODEL:-qwen/qwen3.5-9b}               # модель для фото в LM Studio (ai-check покажет список);
                                                    # видеокарта 6–8 ГБ: qwen/qwen3.5-4b; 24 ГБ: qwen/qwen3.6-35b-a3b
  max_images: 3                 # сколько фото показывать модели
  timeout_seconds: 240
  run_for: promising            # promising — только перспективные (быстрее), all — все подряд
  # ── Ollama вместо LM Studio ──
  # provider: ollama
  # base_url: http://localhost:11434
  # model: qwen3.5:9b-q4_K_M     # ollama pull qwen3.5:9b-q4_K_M

  # Необязательно: «второе мнение» от Claude (облако, платно) — только для лучших находок.
  # Нужен ключ ANTHROPIC_API_KEY в .env и пакет:  pip install anthropic
  second_opinion:
    enabled: false
    provider: anthropic
    model: claude-opus-5
    api_key: ${ANTHROPIC_API_KEY}
    min_score: 70               # проверять только то, что локальная модель уже оценила высоко
    max_per_run: 5              # не больше N платных запросов за одну проверку

  # ИИ-разведчик (docs/design/AI_SCOUT.md): маленькая текстовая модель читает КАЖДОЕ новое объявление
  # (название, цена, начало текста) и находит скрытое: опечатки, старый ПК с дорогой видеокартой,
  # «Konvolut», продавцов, которые не знают, что продают. Цены она не придумывает — они из истории цен.
  # Может работать на слабом сервере без видеокарты (llama.cpp / Ollama), пока модель для фото — на ПК.
  vision_wait_minutes: 45       # ПК с моделью для фото выключен: ждать до N мин, потом прислать «фото не проверены»
  scout:
    enabled: false
    # Сервер, который работает всегда (docs/design/AI_MODELS.md): слабый без видеокарты — Qwen3.5 2B
    # (≈6 с на объявление, ~600 в час), 8 ядер / 16 ГБ — Qwen3.5 4B (точнее, ≈6 с). Модели меньше 2B не годятся.
    provider: openai            # openai = LM Studio / llama-server | ollama
    base_url: ""                # пусто = тот же сервер, что выше; например http://127.0.0.1:8080/v1 (llama-server)
    model: ""                   # пусто = та же модель; LM Studio: qwen/qwen3.5-2b · Ollama: qwen3.5:2b-q4_K_M
    mode: auto                  # auto — все объявления, пока успевает, иначе только непонятные; all; candidates
    batch_size: 0               # объявлений за запрос; 0 = по размеру модели (5 для 2B, 10 для 4B и больше)
    max_per_hour: 600           # не больше N объявлений в час (чтобы слабый процессор не задыхался)
    pass_share: 0.5             # не больше этой доли интервала проверок на чтение
    min_interest: 0             # «интерес» 0–10 у маленьких моделей почти случаен: решают цены; 0 = не отсеивать

# ─── eBay (официальный API) ──────────────────────────────────────────────────
# developer.ebay.com/my/keys → Production keyset: App ID → EBAY_CLIENT_ID, Cert ID → EBAY_CLIENT_SECRET (в .env).
# С ними токен создаётся и обновляется сам. Разовый токен (EBAY_OAUTH_TOKEN) живёт ~2 часа.
ebay:
  client_id: ${EBAY_CLIENT_ID}
  client_secret: ${EBAY_CLIENT_SECRET}
  oauth_token: ${EBAY_OAUTH_TOKEN}
  marketplace_id: EBAY_DE
  item_location_country: DE

# ─── Уведомления ─────────────────────────────────────────────────────────────
notifications:
  min_score: 70                 # присылать только сделки с оценкой от 70/100
  verdicts: [buy]               # [buy] — только «покупать»; [buy, maybe] — и «подумать»
  mode: instant                 # instant — сразу после каждого поиска; digest — одним письмом за проверку
  max_alerts_per_hour: 10       # больше выгодных за час — остальные придут одной сводкой
  health_alerts: true           # сообщить, если нейросеть недоступна, сайт заблокировал или страницы не читаются
  heartbeat_hour: 9             # каждый день в 9:00 — «жив, проверено N объявлений» (пусто = не присылать)
  unchecked_deals: true         # нейросеть недоступна: всё равно прислать выгодное с пометкой «ФОТО НЕ ПРОВЕРЕНЫ ИИ»
  super_deals:                  # «🔥 Супер-находка»: сразу, мимо лимита в час и сводки
    enabled: true
    min_profit: 120             # прибыль от 120 €
    min_roi: 0.8                # и доходность от 80 %
    min_score: 85
  daily_top:                    # «Топ за день»: лучшие сделки за сутки по каждому поиску, одним сообщением
    enabled: false
    hour: 20
    per_search: 3
  email:
    enabled: false
    smtp_host: smtp.gmail.com
    smtp_port: 587
    use_ssl: false
    username: ${SMTP_USER}
    password: ${SMTP_PASSWORD}  # для Gmail — «пароль приложения», не обычный пароль
    from_addr: ${SMTP_USER}
    to_addrs: ${NOTIFY_EMAIL}
  telegram:
    enabled: false              # мастер setup или страница «Настройка» включат и запишут токен в .env
    bot_token: ${TELEGRAM_BOT_TOKEN}
    chat_id: ${TELEGRAM_CHAT_ID}

# ─── Веб-интерфейс ───────────────────────────────────────────────────────────
web:
  host: 127.0.0.1               # 127.0.0.1 — только этот компьютер; 0.0.0.0 — вся сеть: вход по ссылке с ключом,
                                # но НЕ делай так в общем Wi-Fi (общежитие, кафе). Для телефона лучше Tailscale.
  port: 8000
  run_monitor: true             # мониторинг работает в фоне вместе с сайтом
  allowed_hosts: []             # доп. имена, под которыми открываешь панель, например [my-pc.tail1234.ts.net]
